[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spikingjelly-npu"
version = "0.1.0"
description = "A PyTorch-native SpikingJelly-compatible core optimized for Ascend NPU and CANN."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "spikingjelly_npu contributors" }]
keywords = ["spiking-neural-network", "snn", "ascend", "npu", "cann", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["build>=1", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["spikingjelly_npu_aspy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "npu: requires a correctly bootstrapped torch-npu runtime and an idle Ascend device",
  "aspy: requires the optional AsPy native extension built for the qualified CANN stack",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]
